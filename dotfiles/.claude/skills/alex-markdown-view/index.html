<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Markdown Renderer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/github.min.css">
<style>body{color:#24292f;font:16px/1.65 system-ui;margin:0}main{max-width:860px;margin:auto;padding:40px 24px 80px}h1,h2,h3{line-height:1.25;margin-top:1.8em}h2{border-bottom:1px solid #d8dee4;padding-bottom:.3em}pre{overflow:auto;border-radius:6px;padding:16px}code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:.9em}:not(pre)>code{background:#eff1f3;border-radius:4px;padding:.15em .35em}blockquote{border-left:4px solid #d0d7de;color:#57606a;margin-left:0;padding-left:16px}a{color:#0969da}@media(max-width:600px){main{padding:24px 18px 60px}}</style>
<main></main><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/highlight.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script>
let file=new URLSearchParams(location.search).get("file");
let main=document.querySelector("main");
if(!file||/^[a-z]+:/i.test(file)||file.startsWith("/")||file.includes("..")){
  main.textContent="Invalid file parameter.";
}else{
  fetch(file).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(md=>{
    main.innerHTML=DOMPurify.sanitize(marked.parse(md));
    document.title=document.querySelector("h1")?.textContent||file;
    hljs.highlightAll();
  }).catch(e=>{main.textContent=`Could not load "${file}": ${e.message}`});
}
</script>
